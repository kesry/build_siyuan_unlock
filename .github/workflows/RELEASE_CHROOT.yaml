name: 自动编译上游新版本

on:
  schedule:
    # 北京时间4:00
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  # ==================== Job 1: 检查更新 + 准备所有资源（只执行一次） ====================
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      has_new_version: ${{ steps.check.outputs.has_new_version }}
      latest_version: ${{ steps.upstream.outputs.latest }}
      version_clean: ${{ steps.upstream.outputs.version_clean }}
      repo: ${{ steps.upstream.outputs.repo }}
    steps:
      - name: 获取上游最新 Release 版本
        id: upstream
        env:
          REPO: appdev/siyuan-unlock
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/$REPO/releases/latest --jq .tag_name)
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "上游最新版本: ${LATEST}"
          VERSION_CLEAN="${LATEST#v}"
          echo "version_clean=${VERSION_CLEAN}" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: 恢复上次编译的版本缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: .last-version
          key: upstream-version-${{ github.run_id }}
          restore-keys: |
            upstream-version-

      - name: 读取已编译版本并判断是否需要编译
        id: check
        run: |
          if [ -f .last-version ]; then
            CACHED_VERSION=$(cat .last-version)
            echo "cached_version=${CACHED_VERSION}" >> $GITHUB_OUTPUT
          else
            CACHED_VERSION="none"
            echo "cached_version=none" >> $GITHUB_OUTPUT
          fi
          
          if [ "$CACHED_VERSION" != "${{ steps.upstream.outputs.latest }}" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
            echo "发现新版本: ${{ steps.upstream.outputs.latest }} (缓存版本: ${CACHED_VERSION})"
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
            echo "无新版本，跳过编译 (当前版本: ${CACHED_VERSION})"
          fi

      - name: 安装交叉编译工具链
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf zip unzip wget

      - name: 克隆源码并应用补丁
        id: patch
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          # 克隆补丁仓库
          git clone --depth 1 \
            https://github.com/${{ steps.upstream.outputs.repo }}.git patch_repo
          
          # 克隆上游源码
          git clone --depth 1 --branch ${{ steps.upstream.outputs.latest }} \
            https://github.com/siyuan-note/siyuan.git source
          
          cd source
          
          # 应用所有补丁（只执行一次！）
          echo "开始应用补丁..."
          git apply --verbose ${{ github.workspace }}/patch_repo/patches/siyuan/disable-update.patch
          git apply --verbose ${{ github.workspace }}/patch_repo/patches/siyuan/default-config.patch
          git apply --verbose ${{ github.workspace }}/patch_repo/patches/siyuan/mock-vip-user.patch
          git apply --verbose ${{ github.workspace }}/patch_repo/patches/siyuan/hide-account-entry.patch
          
          echo "✅ 所有补丁应用成功"
          git status
          
          # 创建标记文件
          echo "patched-at-$(date -Iseconds)" > patch-applied
          cd ..

      # ========== 新增：在 prepare 中下载前端（只下载一次） ==========
      - name: 下载前端资源（只下载一次，所有架构共享）
        if: steps.check.outputs.has_new_version == 'true'
        env:
          VERSION_CLEAN: ${{ steps.upstream.outputs.version_clean }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          REPO: ${{ steps.upstream.outputs.repo }}
        run: |
          echo "开始下载前端资源..."
          wget "https://github.com/${REPO}/releases/download/${LATEST}/siyuan-${VERSION_CLEAN}-linux.tar.gz"
          tar xzvf "siyuan-${VERSION_CLEAN}-linux.tar.gz"
          rm -f "siyuan-${VERSION_CLEAN}-linux.tar.gz"
          echo "✅ 前端资源下载完成"
          ls -la "siyuan-${VERSION_CLEAN}-linux/"

      - name: 打包完整资源（源码 + 前端）
        if: steps.check.outputs.has_new_version == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-build-resources
          path: |
            source/
            siyuan-*-linux/
            patch_repo/
          retention-days: 1

      - name: 保存版本信息
        if: steps.check.outputs.has_new_version == 'true'
        run: |
          echo "${{ steps.upstream.outputs.latest }}" > .last-version

  # ==================== Job 2: 多架构并行编译（直接使用完整资源） ====================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.has_new_version == 'true'
    strategy:
      matrix:
        include:
          - name: amd64
            goarch: amd64
            goarm: ""
            cc: gcc
          - name: arm64
            goarch: arm64
            goarm: ""
            cc: aarch64-linux-gnu-gcc
          - name: armv7
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc
          - name: armv6
            goarch: arm
            goarm: "6"
            cc: arm-linux-gnueabihf-gcc
      fail-fast: false

    steps:
      - name: 下载完整资源（源码 + 前端）
        uses: actions/download-artifact@v4
        with:
          name: full-build-resources
          path: ./

      - name: 验证资源完整性
        run: |
          if [ ! -f source/patch-applied ]; then
            echo "❌ 错误：源码未打补丁！"
            exit 1
          fi
          echo "✅ 源码已打补丁: $(cat source/patch-applied)"
          
          FRONTEND_DIR="siyuan-${{ needs.prepare.outputs.version_clean }}-linux"
          if [ ! -d "$FRONTEND_DIR" ]; then
            echo "❌ 错误：前端资源不存在！"
            exit 1
          fi
          echo "✅ 前端资源存在: $FRONTEND_DIR"
          ls -la "$FRONTEND_DIR/resources/"

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf zip unzip wget

      - name: Setup Go environment
        uses: actions/setup-go@v6.5.0
        with:
          # The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks.
          go-version: 1.26.0

      - name: 编译 ${{ matrix.name }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          GO111MODULE: on
          GOPROXY: https://proxy.golang.org,direct
        run: |
          echo "开始编译架构: ${{ matrix.name }} (GOARCH=${{ matrix.goarch }})"
          
          # 为每个架构创建独立构建目录，避免相互干扰
          BUILD_DIR="build_${{ matrix.name }}"
          mkdir -p "$BUILD_DIR"
          
          # 复制源码到独立目录
          cp -r source "$BUILD_DIR/"
          cd "$BUILD_DIR/source/kernel"
          
          # 编译内核
          go build --tags fts5 -v -ldflags "-s -w"
          cd ../../..
          
          # 创建输出目录
          mkdir -p "output/${{ matrix.name }}"
          cp "$BUILD_DIR/source/kernel/kernel" "output/${{ matrix.name }}/"
          
          # 直接使用前端资源（无需再下载）
          FRONTEND_DIR="siyuan-${{ needs.prepare.outputs.version_clean }}-linux"
          cp -a "${FRONTEND_DIR}/resources/appearance" "output/${{ matrix.name }}/"
          cp -a "${FRONTEND_DIR}/resources/changelogs" "output/${{ matrix.name }}/"
          cp -a "${FRONTEND_DIR}/resources/guide" "output/${{ matrix.name }}/"
          cp -a "${FRONTEND_DIR}/resources/stage" "output/${{ matrix.name }}/"
          
          # 打包
          cd "output/${{ matrix.name }}"
          zip -r "siyuan_unlock_${{ needs.prepare.outputs.latest_version }}_${{ matrix.name }}.zip" appearance/ changelogs/ guide/ stage/ kernel
          cd ../..
          
          # 清理构建目录（释放空间）
          rm -rf "$BUILD_DIR"
          
          echo "✅ ${{ matrix.name }} 编译完成"

      - name: 上传各架构产物
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-unlock-${{ matrix.name }}-${{ needs.prepare.outputs.latest_version }}
          path: output/${{ matrix.name }}/siyuan_unlock_*.zip
          retention-days: 7

  # ==================== Job 3: 创建 Release ====================
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.has_new_version == 'true'
    permissions:
      contents: write
    steps:
      - name: 下载所有编译产物
        uses: actions/download-artifact@v4

      - name: 获取版本信息
        id: version
        run: |
          VERSION="${{ needs.prepare.outputs.latest_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "将创建 Release: $VERSION"

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.version }}"
          echo "检查 tag: $TAG_NAME 是否存在..."
          
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME 已存在，跳过创建"
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME 不存在，将创建"
          fi

      - name: 获取编译时间
        id: build_time
        run: echo "compile_time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 创建 Release 并上传所有产物
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            🤖 自动编译版本: ${{ steps.version.outputs.version }}
            
            ## 📦 包含架构
            - amd64 (x86_64)
            - arm64 (ARM64)
            - armv7 (ARM 32-bit v7)
            - armv6 (ARM 32-bit v6)
            
            ## 📁 文件说明
            每个 zip 包包含:
            - `kernel` (主程序)
            - `appearance/` (外观资源)
            - `changelogs/` (更新日志)
            - `guide/` (指南)
            - `stage/` (舞台资源)
            
            ## ⏰ 编译时间
            ${{ steps.build_time.outputs.compile_time }}
            
            ## 🔗 上游版本
            [${{ needs.prepare.outputs.latest_version }}](https://github.com/${{ needs.prepare.outputs.repo }}/releases/tag/${{ needs.prepare.outputs.latest_version }})

          draft: false
          prerelease: false
          files: |
            */siyuan_unlock_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
